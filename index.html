<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UsForge News</title>

<script>
/* ======================================================================
   EDIT ANNOUNCEMENTS HERE
   ======================================================================

   HOW TO ADD AN ANNOUNCEMENT (no coding needed):

   1. Copy one whole block below: from its opening  {  down to its
      closing  },  (include the comma).
   2. Paste it right under the line that says  var ANNOUNCEMENTS = [
   3. Change the words inside the quotes. That's it.

   WHAT EACH LINE MEANS:

     title:  the headline.
     date:   the day, written as "YEAR-MONTH-DAY", e.g. "2026-11-12".
     tag:    exactly one of:  "New Game"   "Update"   "Event"   "Site News"
     pinned: true   keeps the post stuck at the top.
             Delete the whole line (or write false) for a normal post.
     link:   a web address for the button. Delete the whole line for no link.
     text:   the message. It sits between two ` marks (the key under Esc),
             so you can press Enter for new lines and use " and ' freely.

   RULES SO NOTHING BREAKS:

     - Keep the quotes "like this" around your words.
     - Keep the comma at the end of each line, and after each  },
     - Don't type a " inside a title. Don't type a ` inside the text.

   The order of the blocks doesn't matter: the page sorts them by date.
   Prefer a form? Open dev.html, it writes this list for you.
   ====================================================================== */

// >>> ANNOUNCEMENTS START (do not change or delete this line)
var ANNOUNCEMENTS = [

  {
    title: "Welcome to UsForge News!",
    date: "2026-11-12",
    tag: "Site News",
    pinned: true,
    text: `This is the place to find out what's happening on UsForge: new games, updates to the ones you already play, and events.

Posts you haven't seen yet get a NEW badge, so you can tell at a glance what changed since your last visit. Use the buttons at the top to show only one kind of news.`
  },

  {
    title: "Example: a new game has landed",
    date: "2026-11-10",
    tag: "New Game",
    link: "https://example.com",
    text: `This is an example post. Replace it with your own announcement.

Say what the game is, how you play it, and why it's worth a try. The link above turns into a "Play now" button.`
  },

  {
    title: "Example: big update with new levels",
    date: "2026-11-05",
    tag: "Update",
    text: `This is an example of a longer post, so you can see how "Read more" works.

What's new:
- Ten new levels in the lava world
- A boss fight at the end of each world
- Saves now work on phones
- Jumping feels snappier

What we fixed:
- The game no longer freezes when you pause during a cutscene
- The sound stays off when you turn it off
- Scores above 99,999 now show correctly

Thanks to everyone who sent in bug reports. Keep them coming!`
  },

  {
    title: "Example: weekend high score challenge",
    date: "2026-10-30",
    tag: "Event",
    text: `This is an example event post. Tell players when it starts, when it ends, and what they have to do.`
  },

];
// <<< ANNOUNCEMENTS END (do not change or delete this line)
</script>

<style>
  :root {
    --bg: #15151c;
    --bg2: #1c1c27;
    --card: #232330;
    --card-line: #37374c;
    --ink: #f4f5fb;
    --ink-soft: #c5c8dc;
    --ink-dim: #8c90aa;
    --blue: #5b8ff9;
    --gold: #f2d147;
    --game: #3ddc84;
    --update: #5b8ff9;
    --event: #ff5fa2;
    --site: #b79cff;
    --other: #b3b8d6;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { height: 100%; }
  body { min-height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(circle at 15% -10%, rgba(91, 143, 249, .22), transparent 45%),
      radial-gradient(circle at 95% 0%, rgba(242, 209, 71, .2), transparent 42%),
      linear-gradient(180deg, var(--bg2), var(--bg) 480px);
    background-color: var(--bg);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  .stars i {
    position: absolute;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    border-radius: 50%;
    background: transparent;
  }

  .stars .twinkle { animation: twinkle 4s ease-in-out infinite; }
  .stars .twinkle.late { animation-delay: -2s; }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 clamp(12px, 4vw, 24px) 40px;
  }

  /* ---------- Header ---------- */

  .hero {
    position: relative;
    padding: clamp(18px, 6vmin, 44px) 0 clamp(10px, 3vmin, 20px);
    text-align: center;
    overflow: hidden;
  }

  .hero h1 {
    position: relative;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: clamp(8px, 2vw, 16px) clamp(10px, 2.6vw, 20px);
    margin: 0;
    font-size: clamp(34px, 11vw, 70px); /* the logo is sized in em */
    line-height: 1;
    animation: drop .5s cubic-bezier(.2, 1.4, .4, 1) both;
  }

  .logo {
    display: block;
    height: 1em;
    width: auto;
    max-width: 100%;
    color: var(--blue);
    filter: drop-shadow(0 .06em 0 rgba(0, 0, 0, .5));
  }

  .logo g, .news-mark g, .studio svg g {
    fill: none;
    stroke: currentColor;
    stroke-miterlimit: 10;
  }

  .news {
    display: block;
    margin-bottom: .04em;
    padding: .13em .2em;
    border-radius: .16em;
    background: var(--gold);
    color: #14141b;
    transform: rotate(-4deg);
    box-shadow: 0 .08em 0 rgba(0, 0, 0, .45);
  }

  .news-mark { display: block; height: .38em; width: auto; }

  .hero p {
    position: relative;
    margin: clamp(8px, 2vmin, 14px) 0 0;
    color: var(--ink-soft);
    font-size: clamp(13px, 3.4vw, 16px);
    font-weight: 600;
  }

  .new-count {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 9px;
    border-radius: 99px;
    background: var(--gold);
    color: #14141b;
    font-weight: 800;
    font-size: .85em;
    white-space: nowrap;
  }

  .embers { position: absolute; inset: 0; pointer-events: none; }

  .embers i {
    position: absolute;
    bottom: -8px;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 8px 2px rgba(242, 209, 71, .8);
    opacity: 0;
    animation: rise linear infinite;
  }

  /* ---------- Filters ---------- */

  .filters {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 8px;
    margin: 0 calc(-1 * clamp(12px, 4vw, 24px));
    padding: 10px clamp(12px, 4vw, 24px);
    overflow-x: auto;
    scrollbar-width: none;
    background: rgba(21, 21, 28, .9);
    border-bottom: 2px solid rgba(242, 209, 71, .35);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }

  .filters::-webkit-scrollbar { display: none; }

  .filters::before, .filters::after { content: ""; margin: auto; }

  .filters button {
    --c: var(--ink);
    flex: none;
    padding: 7px 14px;
    border: 2px solid var(--card-line);
    border-radius: 99px;
    background: var(--card);
    color: var(--ink-soft);
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    cursor: pointer;
    transition: transform .12s, background .12s, color .12s, border-color .12s;
  }

  .filters button::before {
    content: "";
    display: inline-block;
    width: 9px;
    height: 9px;
    margin-right: 7px;
    border-radius: 50%;
    background: var(--c);
  }

  .filters button:hover { border-color: var(--c); color: var(--ink); }
  .filters button:active { transform: scale(.94); }

  .filters button[aria-pressed="true"] {
    background: var(--c);
    border-color: var(--c);
    color: #14141b;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .4);
  }

  .filters button[aria-pressed="true"]::before { background: #14141b; }

  .filters button:first-child { --c: var(--gold); }

  button:focus-visible, a:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 2px;
  }

  /* ---------- Cards ---------- */

  .feed { display: grid; gap: 16px; margin-top: 10px; }

  .t-game   { --c: var(--game); }
  .t-update { --c: var(--update); }
  .t-event  { --c: var(--event); }
  .t-site   { --c: var(--site); }
  .t-other  { --c: var(--other); }

  .card {
    position: relative;
    min-width: 0;
    padding: 16px clamp(14px, 4vw, 22px) 18px;
    border: 2px solid var(--card-line);
    border-top: 6px solid var(--c);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .35);
    animation: pop .45s cubic-bezier(.2, 1.2, .4, 1) both;
    transition: transform .15s, box-shadow .15s;
  }

  @media (hover: hover) {
    .card:hover { transform: translateY(-3px); border-color: var(--gold); border-top-color: var(--c); box-shadow: 0 9px 0 rgba(0, 0, 0, .35); }
  }

  .card.pinned {
    border-color: var(--gold);
    border-top-color: var(--c);
    background: linear-gradient(180deg, rgba(242, 209, 71, .14), transparent 110px), var(--card);
  }

  .meta {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 8px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .chip {
    padding: 2px 10px;
    border-radius: 99px;
    background: var(--c);
    color: #14141b;
  }

  .pin { color: var(--gold); }

  .badge-new {
    padding: 2px 9px;
    border-radius: 6px;
    background: var(--gold);
    color: #14141b;
    transform: rotate(-3deg);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .date {
    margin-left: auto;
    color: var(--ink-dim);
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    font-size: 13px;
  }

  .card h2 {
    margin: 10px 0 6px;
    font-size: clamp(18px, 4.6vw, 22px);
    font-weight: 800;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }

  .text {
    color: var(--ink-soft);
    white-space: pre-line;
    overflow-wrap: anywhere;
  }

  .text.clamp {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 5;
    overflow: hidden;
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
    margin-top: 12px;
  }

  .actions:empty { display: none; }

  .more {
    padding: 4px 0;
    border: 0;
    background: none;
    color: var(--c);
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .more:hover { text-decoration: underline; }

  .link {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 10px;
    background: var(--c);
    color: #14141b;
    font-size: 14px;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .4);
    transition: transform .1s, box-shadow .1s;
  }

  .link:hover { transform: translateY(-1px); box-shadow: 0 5px 0 rgba(0, 0, 0, .4); }
  .link:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .4); }

  .studio {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-top: 34px;
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .studio svg { display: block; width: 190px; max-width: 60%; height: auto; }
  .studio .lazy { color: var(--gold); }
  .studio .studios { color: var(--blue); }
  .studio .shade { opacity: .42; }
  .studio .brolly { stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }

  .empty, .problem {
    padding: 28px 18px;
    border: 2px dashed var(--card-line);
    border-radius: 16px;
    color: var(--ink-soft);
    text-align: center;
    font-weight: 600;
  }

  .problem { border-color: var(--gold); text-align: left; }
  .problem b { color: var(--gold); }

  /* ---------- Mini game ---------- */

  .play-btn {
    position: relative;
    margin-top: clamp(10px, 2.5vmin, 16px);
    padding: 9px 20px;
    border: 0;
    border-radius: 99px;
    background: var(--gold);
    color: #14141b;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .45);
    transition: transform .1s, box-shadow .1s;
  }

  .play-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 0 rgba(0, 0, 0, .45); }
  .play-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, .45); }

  .game {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: radial-gradient(circle at 50% 0%, #1f2740, var(--bg) 70%);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  .game canvas { display: block; width: 100%; height: 100%; }

  .game-hud {
    position: absolute;
    top: 10px;
    left: 12px;
    right: 58px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    font-size: 16px;
    font-weight: 800;
    pointer-events: none;
  }

  .game-hud .score { color: var(--gold); }
  .game-hud .lives { color: var(--event); letter-spacing: .1em; }
  .game-hud .best { color: var(--ink-dim); }

  .game-close {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 38px;
    height: 38px;
    border: 2px solid var(--card-line);
    border-radius: 50%;
    background: var(--card);
    color: var(--ink);
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
  }

  .game-close:hover { border-color: var(--gold); }

  .game-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(360px, calc(100% - 28px));
    max-height: calc(100% - 20px);
    overflow: auto;
    padding: 20px 20px 22px;
    border: 2px solid var(--gold);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 6px 0 rgba(0, 0, 0, .4);
    text-align: center;
    transform: translate(-50%, -50%);
  }

  .game-panel h2 { margin: 0 0 6px; color: var(--gold); font-size: 24px; font-weight: 900; }
  .game-panel p { margin: 0 0 6px; color: var(--ink-soft); }
  .game-panel .how { color: var(--ink-dim); font-size: 14px; }

  /* ---------- Animations ---------- */

  @keyframes pop {
    from { opacity: 0; transform: translateY(18px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes drop {
    from { opacity: 0; transform: translateY(-14px) scale(.9); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes twinkle {
    0%, 100% { opacity: 1; }
    50%      { opacity: .25; }
  }

  @keyframes pulse {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50%      { transform: rotate(-3deg) scale(1.1); }
  }

  @keyframes rise {
    0%   { opacity: 0; transform: translate(0, 0) scale(1); }
    15%  { opacity: .9; }
    100% { opacity: 0; transform: translate(var(--drift, 10px), -160px) scale(.3); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .embers { display: none; }
    .stars .twinkle { opacity: 1; }
  }
</style>
</head>
<body>

<div class="stars" id="stars" aria-hidden="true"></div>

<div class="wrap">
  <header class="hero">
    <div class="embers" id="embers" aria-hidden="true"></div>
    <h1 aria-label="UsForge News">
      <!-- UsForge logo, drawn as shapes so it looks the same on every device -->
      <svg class="logo" viewBox="0 0 641 130" aria-hidden="true">
        <defs><clipPath id="capBox"><rect x="-2" y="0" width="110" height="100"/></clipPath></defs>
        <g stroke-width="19">
          <path transform="scale(1.3)" d="M9.5,0V62a28.5,28.5 0 0 0 57,0V0"/>

          <path transform="translate(187.8,0) scale(1.3)" d="M62,9.5H9.5V100M9.5,54H47"/>

          <path transform="translate(470.4,30)" d="M78.64,21.36A40.5,40.5 0 1 0 90.5,50M100,55H54"/>
          <path transform="translate(580.4,30)" d="M60,9.5H9.5V90.5H60M9.5,50H52"/>
        </g>
      </svg>
      <span class="news">
        <svg class="news-mark" viewBox="0 0 339 100" aria-hidden="true">
          <defs>
            <clipPath id="newsBox"><rect x="0" y="0" width="100" height="100"/></clipPath>
            <clipPath id="nBox"><rect x="0" y="0" width="80" height="100"/></clipPath>
          </defs>
          <g stroke-width="19">
            <path clip-path="url(#nBox)" d="M9.5,0V100M70.5,0V100M6.5,-5L73.5,105"/>
            <path transform="translate(90,0)" d="M60,9.5H9.5V90.5H60M9.5,50H52"/>

            <path transform="translate(270,0)" d="M57,25C52,15 44,9.5 34,9.5C20,9.5 11,17 11,28.5C11,40 20,45 34.5,49.5C49,54 58,59.5 58,71.5C58,83 48,90.5 34.5,90.5C23,90.5 14,84.5 9.5,74"/>
          </g>
        </svg>
      </span>
    </h1>
    <p>Fresh from the forge: new games, updates and events <span class="new-count" id="newCount" hidden></span></p>
    <button type="button" class="play-btn" id="playBtn">&#9654; Play Star Catcher</button>
  </header>

  <nav class="filters" id="filters" aria-label="Filter news by type"></nav>

  <main class="feed" id="feed" aria-live="polite"></main>

  <footer class="studio">
    <span>Made by</span>

          <path d="M41,31V20a11,11 0 0 0 -11,-11H20a11,11 0 0 0 -11,11V35L41,65V80a11,11 0 0 1 -11,11H20a11,11 0 0 1 -11,-11V69"/>

      <g class="lazy" transform="translate(58,34) scale(1.15)">

        <use href="#studiosWord" class="shade" x="5" y="6"/>
        <use href="#studiosWord"/>

      <!-- the little beach umbrella on the Y -->
      <g class="brolly" transform="translate(297,36) rotate(22) scale(1.25)" fill="none">
        <path d="M0,0V-20"/>
        <path d="M-21,-20A21,15 0 0 1 21,-20Q14,-24 7,-20Q0,-24 -7,-20Q-14,-24 -21,-20Z"/>
        <path d="M0,-35Q-8,-29 -7,-20M0,-35Q8,-29 7,-20"/>
      </g>
    </svg>
  </footer>
</div>

<!-- Mini game: Star Catcher -->
<div class="game" id="game" role="dialog" aria-modal="true" aria-label="Star Catcher mini game" hidden>
  <canvas id="gameCanvas"></canvas>
  <div class="game-hud" aria-live="off">
    <span class="score" id="gScore"></span>
    <span class="lives" id="gLives"></span>
    <span class="best" id="gBest"></span>
  </div>
  <button type="button" class="game-close" id="gameClose" aria-label="Close the game">&#10005;</button>
  <div class="game-panel" id="gamePanel">
    <h2 id="gameTitle">Star Catcher</h2>
    <p id="gameMsg">Catch the gold stars in your umbrella. Dodge the red meteors: three hits and it's over!</p>
    <p class="how">Move with your mouse or finger, or the &larr; &rarr; keys.</p>
    <button type="button" class="play-btn" id="gameStart">Play</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var feed = document.getElementById("feed");
  var filtersEl = document.getElementById("filters");
  var newCountEl = document.getElementById("newCount");

  // If the list above has a typo, the browser never creates ANNOUNCEMENTS.
  // Say so in plain words instead of showing a blank page.
  if (typeof ANNOUNCEMENTS === "undefined" || !Array.isArray(ANNOUNCEMENTS)) {
    filtersEl.hidden = true;
    var box = document.createElement("div");
    box.className = "problem";
    box.innerHTML = "<b>The announcements list has a typo, so the news can't be shown.</b><br>" +
      "Open index.html and check the post you last edited: every line needs its quotes and " +
      "the comma at the end, and every post must end with <b>},</b>";
    feed.appendChild(box);
    return;
  }

  var TAGS = ["New Game", "Update", "Event", "Site News"];
  var TAG_CLASS = { "New Game": "t-game", "Update": "t-update", "Event": "t-event", "Site News": "t-site" };
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var STORE_KEY = "usforge-news-seen-v1";

  /* ---------- Reading the list ---------- */

  function parseDate(s) {
    var m = /^\s*(\d{4})-(\d{1,2})-(\d{1,2})\s*$/.exec(s);
    if (m) return { time: Date.UTC(+m[1], +m[2] - 1, +m[3]), label: MONTHS[+m[2] - 1] + " " + (+m[3]) + ", " + m[1] };
    return { time: 0, label: s };
  }

  // Only normal web addresses become buttons.
  function safeLink(s) {
    s = String(s || "").trim();
    if (!s) return "";
    if (/^www\./i.test(s)) return "https://" + s;
    if (/^[a-z][a-z0-9+.-]*:/i.test(s) && !/^https?:\/\//i.test(s)) return "";
    return s;
  }

  function hash(s) {
    var h = 5381;
    for (var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  var posts = ANNOUNCEMENTS.filter(function (p) {
    return p && typeof p === "object";
  }).map(function (p, i) {
    var title = String(p.title || "Untitled").trim();
    var rawDate = String(p.date || "").trim();
    var d = parseDate(rawDate);
    return {
      id: hash(title + "|" + rawDate),
      title: title,
      time: d.time,
      dateLabel: d.label,
      tag: String(p.tag || "Site News").trim(),
      text: String(p.text || "").trim(),
      link: safeLink(p.link),
      pinned: p.pinned === true,
      order: i
    };
  });

  posts.sort(function (a, b) {
    return (b.pinned - a.pinned) || (b.time - a.time) || (a.order - b.order);
  });

  /* ---------- Remembering what the visitor has seen ---------- */

  var seen = {};
  try {
    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    if (Array.isArray(saved)) saved.forEach(function (id) { seen[id] = true; });
  } catch (e) { /* storage blocked: everything just shows as new */ }

  var isNew = {};
  var newCount = 0;
  posts.forEach(function (p) {
    if (!seen[p.id]) { isNew[p.id] = true; newCount++; }
  });

  if (newCount) {
    newCountEl.textContent = newCount + " new";
    newCountEl.hidden = false;
  }

  function markSeen(id) {
    if (seen[id]) return;
    seen[id] = true;
    try {
      // Only keep posts that still exist, so this never grows forever.
      var ids = posts.filter(function (p) { return seen[p.id]; }).map(function (p) { return p.id; });
      localStorage.setItem(STORE_KEY, JSON.stringify(ids));
    } catch (e) { /* storage blocked: nothing to do */ }
  }

  // A post counts as seen once it has been on screen for a moment.
  // The badge stays for this visit and is gone on the next one.
  var watcher = null;
  if ("IntersectionObserver" in window) {
    watcher = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var el = en.target;
        clearTimeout(el._seenTimer);
        if (en.isIntersecting) {
          el._seenTimer = setTimeout(function () {
            markSeen(el.dataset.id);
            watcher.unobserve(el);
          }, 1000);
        }
      });
    }, { threshold: 0.2 });
  }

  /* ---------- Building the page ---------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildCard(p) {
    var card = el("article", "card " + (TAG_CLASS[p.tag] || "t-other") + (p.pinned ? " pinned" : ""));
    card.dataset.id = p.id;

    var meta = el("div", "meta");
    meta.appendChild(el("span", "chip", p.tag));
    if (p.pinned) meta.appendChild(el("span", "pin", "★ Pinned"));
    if (isNew[p.id]) meta.appendChild(el("span", "badge-new", "New"));
    if (p.dateLabel) meta.appendChild(el("span", "date", p.dateLabel));
    card.appendChild(meta);

    card.appendChild(el("h2", "", p.title));

    var text = el("div", "text clamp", p.text);
    card.appendChild(text);

    var actions = el("div", "actions");
    if (p.link) {
      var a = el("a", "link", p.tag === "New Game" ? "Play now ↗" : "Open link ↗");
      a.href = p.link;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      actions.appendChild(a);
    }
    var more = el("button", "more", "Read more ▾");
    more.type = "button";
    more.hidden = true;
    more.setAttribute("aria-expanded", "false");
    more.addEventListener("click", function () {
      var open = text.classList.toggle("clamp") === false;
      more.textContent = open ? "Show less ▴" : "Read more ▾";
      more.setAttribute("aria-expanded", String(open));
    });
    actions.appendChild(more);
    card.appendChild(actions);

    return card;
  }

  // Show "Read more" only on posts whose text is actually cut off.
  function checkClamps() {
    var cards = feed.querySelectorAll(".card");
    for (var i = 0; i < cards.length; i++) {
      var text = cards[i].querySelector(".text");
      var more = cards[i].querySelector(".more");
      if (!text.classList.contains("clamp")) continue; // opened by the reader
      more.hidden = text.scrollHeight <= text.clientHeight + 2;
    }
  }

  var current = "All";

  function render() {
    feed.textContent = "";
    var list = posts.filter(function (p) { return current === "All" || p.tag === current; });

    if (!list.length) {
      feed.appendChild(el("div", "empty", posts.length
        ? "Nothing here yet. Try another filter!"
        : "No news yet. Check back soon!"));
      return;
    }

    list.forEach(function (p, i) {
      var card = buildCard(p);
      card.style.animationDelay = Math.min(i, 8) * 60 + "ms";
      feed.appendChild(card);
      if (isNew[p.id]) {
        if (watcher) watcher.observe(card); else markSeen(p.id);
      }
    });
    checkClamps();
  }

  ["All"].concat(TAGS).forEach(function (tag) {
    var b = el("button", TAG_CLASS[tag] || "", tag);
    b.type = "button";
    b.setAttribute("aria-pressed", String(tag === current));
    b.addEventListener("click", function () {
      current = tag;
      var all = filtersEl.querySelectorAll("button");
      for (var i = 0; i < all.length; i++) all[i].setAttribute("aria-pressed", String(all[i] === b));
      render();
    });
    filtersEl.appendChild(b);
  });

  render();

  var resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(checkClamps, 120);
  });

  /* ---------- Starry background ---------- */

  // Each layer is one tiny dot copied many times with box-shadow: cheap to draw.
  function starLayer(count, size, color, cls) {
    var dots = [];
    for (var n = 0; n < count; n++) {
      dots.push((Math.random() * 100).toFixed(2) + "vw " + (Math.random() * 100).toFixed(2) + "vh 0 " + size + "px " + color);
    }
    var layer = document.createElement("i");
    if (cls) layer.className = cls;
    layer.style.boxShadow = dots.join(",");
    document.getElementById("stars").appendChild(layer);
  }

  starLayer(70, 0, "rgba(255,255,255,.55)", "");
  starLayer(22, 0.5, "rgba(255,255,255,.9)", "twinkle");
  starLayer(16, 0.6, "rgba(242,209,71,.95)", "twinkle late");

  /* ---------- Header sparks ---------- */

  var embers = document.getElementById("embers");
  for (var i = 0; i < 10; i++) {
    var s = document.createElement("i");
    s.style.left = (5 + Math.random() * 90) + "%";
    s.style.setProperty("--drift", (Math.random() * 40 - 20) + "px");
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 5) + "s";
    embers.appendChild(s);
  }
})();
</script>
<script>
/* ======================================================================
   MINI GAME: Star Catcher. Nothing to edit here for announcements.
   ====================================================================== */
(function () {
  "use strict";

  var BEST_KEY = "usforge-news-starcatcher-best-v1";
  var box = document.getElementById("game");
  var cv = document.getElementById("gameCanvas");
  var ctx = cv.getContext && cv.getContext("2d");
  var playBtn = document.getElementById("playBtn");
  if (!ctx) { playBtn.hidden = true; return; }

  var panel = document.getElementById("gamePanel");
  var startBtn = document.getElementById("gameStart");
  var titleEl = document.getElementById("gameTitle");
  var msgEl = document.getElementById("gameMsg");
  var scoreEl = document.getElementById("gScore");
  var livesEl = document.getElementById("gLives");
  var bestEl = document.getElementById("gBest");

  var W = 0, H = 0;
  var running = false, raf = 0, last = 0;
  var px = 0, target = null, keys = {};
  var items = [], sparks = [], sky = [];
  var score = 0, lives = 3, time = 0, spawnIn = 0, flash = 0, best = 0;

  try { best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

  for (var i = 0; i < 60; i++) sky.push([Math.random(), Math.random(), Math.random() < 0.25]);

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function bowlW() { return clamp(W * 0.18, 56, 120); }
  function bowlY() { return H - Math.max(52, H * 0.14); }

  function hud() {
    scoreEl.textContent = "★ " + score;
    livesEl.textContent = "♥♥♥".slice(0, Math.max(lives, 0)) || "–";
    bestEl.textContent = "Best " + best;
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = box.clientWidth;
    H = box.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    px = clamp(px || W / 2, 0, W);
    if (!running) draw();
  }

  /* ----- Game rules ----- */

  function start() {
    score = 0; lives = 3; time = 0; flash = 0;
    items = []; sparks = [];
    spawnIn = 0.4;
    px = W / 2; target = null; keys = {};
    panel.hidden = true;
    running = true;
    hud();
    last = performance.now();
    raf = requestAnimationFrame(tick);
  }

  function gameOver() {
    running = false;
    var record = score > best;
    if (record) {
      best = score;
      try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
    }
    hud();
    titleEl.textContent = record ? "New best!" : "Game over";
    msgEl.textContent = "You caught " + score + (score === 1 ? " star." : " stars.");
    startBtn.textContent = "Play again";
    panel.hidden = false;
    startBtn.focus();
  }

  function spawn(level) {
    var r = clamp(Math.min(W, H) * 0.035, 11, 20);
    items.push({
      x: r + Math.random() * (W - 2 * r),
      y: -r,
      r: r,
      bad: Math.random() < 0.22 + 0.2 * level,
      vy: H * (0.32 + 0.4 * level) * (0.85 + Math.random() * 0.3),
      rot: Math.random() * 6,
      spin: (Math.random() - 0.5) * 4
    });
  }

  function burst(x, y, color) {
    for (var n = 0; n < 8; n++) {
      var a = Math.random() * 6.283, v = 60 + Math.random() * 120;
      sparks.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.5, color: color });
    }
  }

  function update(dt) {
    time += dt;
    var level = Math.min(time / 60, 1); // gets harder for the first minute
    var bw = bowlW(), by = bowlY();

    var dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (dir) { px += dir * Math.max(420, W * 0.9) * dt; target = null; }
    else if (target !== null) px += (target - px) * Math.min(1, dt * 18);
    px = clamp(px, bw / 2, W - bw / 2);

    spawnIn -= dt;
    if (spawnIn <= 0) {
      spawn(level);
      spawnIn = 0.85 - 0.5 * level + Math.random() * 0.2;
    }

    for (var n = items.length - 1; n >= 0; n--) {
      var it = items[n];
      it.y += it.vy * dt;
      it.rot += it.spin * dt;
      var inBowl = it.y + it.r >= by && it.y - it.r <= by + bw * 0.28 &&
                   Math.abs(it.x - px) <= bw / 2 + it.r * 0.3;
      if (inBowl) {
        if (it.bad) { lives--; flash = 0.25; burst(it.x, by, "#ff6b6b"); }
        else { score++; burst(it.x, by, "#f2d147"); }
        items.splice(n, 1);
        hud();
      } else if (it.y - it.r > H) {
        items.splice(n, 1);
      }
    }

    for (var k = sparks.length - 1; k >= 0; k--) {
      var s = sparks[k];
      s.life -= dt;
      if (s.life <= 0) { sparks.splice(k, 1); continue; }
      s.vy += 400 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
    }

    if (flash > 0) flash -= dt;
    if (lives <= 0) gameOver();
  }

  /* ----- Drawing ----- */

  function starPath(x, y, r, rot) {
    ctx.beginPath();
    for (var n = 0; n < 10; n++) {
      var a = rot + n * Math.PI / 5, rr = n % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.sin(a) * rr, y - Math.cos(a) * rr);
    }
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    for (var n = 0; n < sky.length; n++) {
      ctx.fillStyle = sky[n][2] ? "rgba(242,209,71,.7)" : "rgba(255,255,255,.45)";
      ctx.fillRect(sky[n][0] * W, sky[n][1] * H, 1.5, 1.5);
    }

    for (var m = 0; m < items.length; m++) {
      var it = items[m];
      if (it.bad) {
        var tail = ctx.createLinearGradient(0, it.y - it.r * 3.5, 0, it.y);
        tail.addColorStop(0, "rgba(255,107,107,0)");
        tail.addColorStop(1, "rgba(255,107,107,.55)");
        ctx.fillStyle = tail;
        ctx.fillRect(it.x - it.r * 0.6, it.y - it.r * 3.5, it.r * 1.2, it.r * 3.5);
        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.r * 0.85, 0, 6.283);
        ctx.fill();
        ctx.fillStyle = "#b13a48";
        ctx.beginPath();
        ctx.arc(it.x - it.r * 0.25, it.y - it.r * 0.2, it.r * 0.22, 0, 6.283);
        ctx.arc(it.x + it.r * 0.3, it.y + it.r * 0.25, it.r * 0.16, 0, 6.283);
        ctx.fill();
      } else {
        ctx.fillStyle = "#f2d147";
        starPath(it.x, it.y, it.r, it.rot);
        ctx.fill();
      }
    }

    // The upturned umbrella
    var bw = bowlW(), by = bowlY(), depth = bw * 0.36;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#f4f5fb";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px, by + depth);
    ctx.lineTo(px, by + depth + bw * 0.22);
    ctx.arc(px + bw * 0.07, by + depth + bw * 0.22, bw * 0.07, Math.PI, 0, true);
    ctx.stroke();
    ctx.fillStyle = "#5b8ff9";
    ctx.beginPath();
    ctx.ellipse(px, by, bw / 2, depth, 0, 0, Math.PI);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(20,20,27,.35)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px - bw / 6, by); ctx.quadraticCurveTo(px - bw / 8, by + depth * 0.7, px, by + depth);
    ctx.moveTo(px + bw / 6, by); ctx.quadraticCurveTo(px + bw / 8, by + depth * 0.7, px, by + depth);
    ctx.stroke();
    ctx.strokeStyle = "#f2d147";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(px - bw / 2, by);
    ctx.lineTo(px + bw / 2, by);
    ctx.stroke();

    for (var k = 0; k < sparks.length; k++) {
      var s = sparks[k];
      ctx.globalAlpha = Math.max(0, s.life * 2);
      ctx.fillStyle = s.color;
      ctx.fillRect(s.x - 2, s.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,107,107," + (flash * 1.2).toFixed(2) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  function tick(now) {
    if (!running) return;
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    if (running) raf = requestAnimationFrame(tick);
  }

  /* ----- Opening, closing, controls ----- */

  function open() {
    box.hidden = false;
    document.body.style.overflow = "hidden";
    titleEl.textContent = "Star Catcher";
    msgEl.textContent = "Catch the gold stars in your umbrella. Dodge the red meteors: three hits and it's over!";
    startBtn.textContent = "Play";
    panel.hidden = false;
    score = 0; lives = 3; items = []; sparks = []; flash = 0;
    hud();
    resize();
    startBtn.focus();
  }

  function close() {
    running = false;
    cancelAnimationFrame(raf);
    box.hidden = true;
    document.body.style.overflow = "";
    playBtn.focus();
  }

  playBtn.addEventListener("click", open);
  startBtn.addEventListener("click", start);
  document.getElementById("gameClose").addEventListener("click", close);

  function point(e) {
    target = e.clientX - box.getBoundingClientRect().left;
  }
  cv.addEventListener("pointerdown", point);
  cv.addEventListener("pointermove", point);

  function key(e, down) {
    if (box.hidden) return;
    var k = e.key;
    if (k === "Escape" && down) { close(); return; }
    if (k === "ArrowLeft" || k === "a" || k === "A") keys.left = down;
    else if (k === "ArrowRight" || k === "d" || k === "D") keys.right = down;
    else return;
    e.preventDefault();
  }
  window.addEventListener("keydown", function (e) { key(e, true); });
  window.addEventListener("keyup", function (e) { key(e, false); });
  window.addEventListener("blur", function () { keys = {}; });
  window.addEventListener("resize", function () { if (!box.hidden) resize(); });
})();
</script>
</body>
</html>
